<main><section class="review-intro"><div><h1>三种气质，同一种从容。</h1><p>日程、事项与行动，共用一套内容，比较三套完整的视觉语言。</p></div><div class="view-controls" role="group" aria-label="同步切换预览页面"><button data-view="schedule" aria-pressed="true">日程</button><button data-view="things" aria-pressed="false">事项</button><button data-view="action" aria-pressed="false">行动</button></div></section>
<div class="mobile-choices" role="group" aria-label="选择视觉方案"><button data-style="mist" aria-pressed="true">雾青玻璃</button><button data-style="paper" aria-pressed="false">纸页手账</button><button data-style="night" aria-pressed="false">夜航深色</button></div>
<p class="review-help">可点击日期展开或收起、勾选任务、切换底部导航，查看周计划与新增浮层。预览使用独立演示数据。</p>
<div id="directions" class="directions"></div>
<section class="comparison"><h2>如何选？</h2><div class="comparison-grid"><p><strong>偏爱轻盈与空间感</strong>选雾青玻璃。延续当前原型的呼吸感，材质集中在浮层。</p><p><strong>偏爱文字与记录感</strong>选纸页手账。中文标题、细线和日期排版更有温度。</p><p><strong>偏爱专注与夜间使用</strong>选夜航深色。信息更利落，完成、选中和警示有明确层次。</p></div><p class="footnote">这是一轮风格候选，尚未替换正式原型。正文优先可读，所有方案保留相同的功能和导航规则。</p></section></main>
